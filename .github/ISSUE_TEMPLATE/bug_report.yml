name: Bug report
description: Report a reproducible Desknotch problem
body:
  - type: input
    id: version
    attributes:
      label: Desknotch version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2, build 26100.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and expected/actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted log lines
      description: Remove notification bodies, clipboard contents, calendar feed URLs and tokens before sharing.
    validations:
      required: false
